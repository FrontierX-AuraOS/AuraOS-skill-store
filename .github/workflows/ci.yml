name: Skills CI

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'registry.json'
  push:
    branches: [main]
    paths:
      - 'skills/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  # ── Validate every MANIFEST.yaml ──────────────────────
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all MANIFEST.yaml files
        run: python3 scripts/ci-validate.py

  # ── Security scan on .py files ───────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Security scan
        run: python3 scripts/ci-security-scan.py

  # ── Registry dry-run (PR only) ───────────────────────
  registry-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [validate-manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Generate registry (dry-run)
        run: python3 scripts/ci-registry.py --dry-run

  # ── Build & deploy registry on merge to main ──────────
  build-registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate-manifests, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Generate registry.json
        run: python3 scripts/ci-registry.py

      - name: Commit & push registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet registry.json; then
            git add registry.json
            git commit -m "chore: update registry.json [skip ci]"
            git push
            echo "✅ registry.json pushed"
          else
            echo "No changes to registry.json"
          fi
