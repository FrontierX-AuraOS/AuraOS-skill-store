id: echo-repeat
name: Echo Speaker
version: 1.0.0
author: FrontierX
description: >-
  重复用户说的话，带情绪语调。A friendly demo persona that echoes what you say.
license: MIT
minAuraVersion: 0.1.2
tags: [demo, persona]

permissions:
  tools:
    - say
  network:
    domains: []
  filesystem:
    scope: skill
  maxRuntimeSec: 10

entry:
  type: python
  main: main.py
  function: run
